<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSpark - Gameoverzicht</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">GameSpark</a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="overzicht.html" class="actief">Overzicht</a>
            <a href="over-ons.html">Over ons</a>
        </nav>
    </header>

    <main class="container">
        <section class="pagina-kop">
            <h1>Gameoverzicht</h1>
            <a href="toevoegen.html" class="knop knop-primair">+ Nieuwe game</a>
        </section>

        <section class="zoekbalk">
            <input type="search" placeholder="Zoek op naam of releasejaar">
            <select>
                <option>Sorteer op</option>
                <option>Naam A-Z</option>
                <option>Naam Z-A</option>
                <option>Releasejaar nieuw-oud</option>
                <option>Releasejaar oud-nieuw</option>
                <option>Rating hoog-laag</option>
                <option>Rating laag-hoog</option>
            </select>
        </section>

        <section class="filters">
            <div class="veld">
                <label for="filter-platform">Platform</label>
                <select id="filter-platform">
                    <option>Alle platforms</option>
                    <option>PC</option>
                    <option>PlayStation</option>
                    <option>Xbox</option>
                    <option>Switch</option>
                </select>
            </div>
            <div class="veld">
                <label for="filter-genre">Genre</label>
                <select id="filter-genre">
                    <option>Alle genres</option>
                    <option>Action</option>
                    <option>Adventure</option>
                    <option>RPG</option>
                    <option>Strategy</option>
                    <option>Sport</option>
                </select>
            </div>
            <div class="veld">
                <label for="filter-status">Status</label>
                <select id="filter-status">
                    <option>Alle statussen</option>
                    <option>Wishlist</option>
                    <option>In bezit</option>
                    <option>Speelt nu</option>
                    <option>Uitgespeeld</option>
                </select>
            </div>
            <div class="veld">
                <label for="filter-rating-van">Beoordeling</label>
                <div class="van-tot">
                    <select id="filter-rating-van">
                        <option>Van 1</option>
                        <option>Van 2</option>
                        <option>Van 3</option>
                        <option>Van 4</option>
                        <option>Van 5</option>
                    </select>
                    <select id="filter-rating-tot">
                        <option>Tot 5</option>
                        <option>Tot 4</option>
                        <option>Tot 3</option>
                        <option>Tot 2</option>
                        <option>Tot 1</option>
                    </select>
                </div>
            </div>
        </section>

        <p class="aantal">3 games</p>

        <section class="kolommen">
            <div class="kolom">
                <h2>Speelt nu <span>1</span></h2>
            </div>
            <div class="kolom">
                <h2>Uitgespeeld <span>1</span></h2>
            </div>
            <div class="kolom">
                <h2>Wishlist <span>1</span></h2>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>GameSpark</span>
        <span>Gameoverzicht</span>
    </footer>
</body>
</html>
