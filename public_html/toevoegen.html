<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSpark - Nieuwe game</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">GameSpark</a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="overzicht.html">Overzicht</a>
            <a href="over-ons.html">Over ons</a>
        </nav>
    </header>

    <main class="container">
        <section class="pagina-kop">
            <h1>Nieuwe game</h1>
        </section>

        <form class="formulier" action="#" method="post">
            <fieldset>
                <legend>Gegevens</legend>
                <div class="rij">
                    <div class="veld veld-breed">
                        <label for="naam">Naam *</label>
                        <input type="text" id="naam" name="naam" placeholder="Bijv. Hollow Knight" required>
                    </div>
                    <div class="veld">
                        <label for="releasejaar">Releasejaar *</label>
                        <input type="number" id="releasejaar" name="releasejaar" min="1970" max="2030" placeholder="Bijv. 2017" required>
                    </div>
                </div>
            </fieldset>
        </form>
    </main>

    <footer class="footer">
        <span>GameSpark</span>
        <span>Nieuwe game</span>
    </footer>
</body>
</html>
