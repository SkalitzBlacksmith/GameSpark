<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSpark - Nieuwe game</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">GameSpark</a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="overzicht.html">Overzicht</a>
            <a href="over-ons.html">Over ons</a>
        </nav>
    </header>

    <main class="container">
        <section class="pagina-kop">
            <h1>Nieuwe game</h1>
        </section>

        <form class="formulier" action="#" method="post">
            <fieldset>
                <legend>Gegevens</legend>
                <div class="rij">
                    <div class="veld veld-breed">
                        <label for="naam">Naam *</label>
                        <input type="text" id="naam" name="naam" placeholder="Bijv. Hollow Knight" required>
                    </div>
                    <div class="veld">
                        <label for="releasejaar">Releasejaar *</label>
                        <input type="number" id="releasejaar" name="releasejaar" min="1970" max="2030" placeholder="Bijv. 2017" required>
                    </div>
                </div>
                <div class="rij">
                    <div class="veld">
                        <label for="platform">Platform *</label>
                        <select id="platform" name="platform" required>
                            <option value="">Kies een platform</option>
                            <option>PC</option>
                            <option>PlayStation</option>
                            <option>Xbox</option>
                            <option>Switch</option>
                        </select>
                    </div>
                    <div class="veld">
                        <label for="genre">Genre</label>
                        <select id="genre" name="genre">
                            <option value="">Kies een genre</option>
                            <option>Action</option>
                            <option>Adventure</option>
                            <option>RPG</option>
                            <option>Strategy</option>
                            <option>Sport</option>
                        </select>
                    </div>
                </div>
                <div class="rij">
                    <div class="veld veld-breed">
                        <label for="afbeelding_url">Afbeelding-URL</label>
                        <input type="url" id="afbeelding_url" name="afbeelding_url" placeholder="https://...">
                    </div>
                    <div class="voorbeeld">Voorbeeld</div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Voortgang</legend>
                <div class="rij">
                    <div class="veld">
                        <label for="status">Status *</label>
                        <select id="status" name="status" required>
                            <option value="">Kies een status</option>
                            <option>Wishlist</option>
                            <option>In bezit</option>
                            <option>Speelt nu</option>
                            <option>Uitgespeeld</option>
                        </select>
                    </div>
                    <div class="veld">
                        <label for="rating">Rating (1-5)</label>
                        <input type="number" id="rating" name="rating" min="1" max="5" placeholder="1 tot en met 5">
                    </div>
                </div>
                <p class="hint">Statusopties: Wishlist · In bezit · Speelt nu · Uitgespeeld</p>

                <h3>Persoonlijk</h3>
                <div class="veld">
                    <label for="aangeraden_door">Aangeraden door</label>
                    <input type="text" id="aangeraden_door" name="aangeraden_door" placeholder="Naam van de tipgever">
                </div>
                <div class="veld">
                    <label for="notitie">Notitie</label>
                    <textarea id="notitie" name="notitie" rows="4" maxlength="280" placeholder="Schrijf een korte notitie"></textarea>
                    <span class="teller" id="teller">0/280</span>
                </div>
            </fieldset>
        </form>
    </main>

    <footer class="footer">
        <span>GameSpark</span>
        <span>Nieuwe game</span>
    </footer>
</body>
</html>
