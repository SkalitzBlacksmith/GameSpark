<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSpark - Home</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">GameSpark</a>
        <nav class="nav">
            <a href="index.html" class="actief">Home</a>
            <a href="overzicht.html">Overzicht</a>
            <a href="over-ons.html">Over ons</a>
        </nav>
    </header>

    <main class="container">
        <section class="pagina-kop">
            <h1>Game-archief</h1>
            <a href="toevoegen.html" class="knop knop-primair">+ Nieuwe game</a>
        </section>

        <section class="zoekbalk">
            <input type="search" placeholder="Zoek op naam of releasejaar">
            <select>
                <option>Sorteer op</option>
                <option>Naam A-Z</option>
                <option>Naam Z-A</option>
                <option>Releasejaar nieuw-oud</option>
                <option>Releasejaar oud-nieuw</option>
                <option>Rating hoog-laag</option>
                <option>Rating laag-hoog</option>
            </select>
        </section>

        <section class="uitgelicht">
            <div class="afbeelding">Geen afbeelding</div>
            <div class="uitgelicht-info">
                <p class="label">Verder spelen</p>
                <h2>Cyberpunk 2077</h2>
                <p>PC · Action · 2020</p>
                <a href="#" class="knop">Openen</a>
            </div>
        </section>

        <div class="knoppen">
            <a href="overzicht.html" class="knop">Naar overzicht</a>
            <a href="#" class="knop">+ Op wishlist</a>
            <a href="#" class="knop">Exporteer CSV</a>
        </div>

        <section class="recent">
            <h2>Recent</h2>
            <ul class="recent-lijst">
                <li>
                    <span class="nummer">02</span>
                    <span class="naam">Hollow Knight</span>
                    <span class="meta">PC · Uitgespeeld</span>
                    <span class="rating">5/5</span>
                </li>
                <li>
                    <span class="nummer">03</span>
                    <span class="naam">The Witcher 3</span>
                    <span class="meta">PS4 · Wishlist</span>
                    <span class="rating">-</span>
                </li>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <span>GameSpark</span>
        <span>Home</span>
    </footer>
</body>
</html>
